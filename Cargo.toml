[workspace]
resolver = "2"
members = ["crates/costline-core", "cli", "src-tauri"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
authors = ["costline"]

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["clock"] }
dirs = "6.0.0"
encoding_rs = "0.8.35"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.9.12"
costline-core = { path = "crates/costline-core" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
